server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    # Ensure WebAssembly and Web App Manifest MIME types are explicitly handled
    # without risking duplicate-extension warnings in /etc/nginx/mime.types.
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Gzip compression for Wasm, JS, JSON, manifests, SVG, and CSS
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/wasm
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never cache runtime config, service worker, or SPA shell entrypoint
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Static PWA icons and Compose resources
    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location /composeResources/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # SPA fallback routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
