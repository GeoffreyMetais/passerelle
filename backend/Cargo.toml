[package]
name = "passerelle-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "passerelle_backend"
path = "src/lib.rs"

[[bin]]
name = "passerelle-backend"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Web framework & HTTP
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "set-header"] }

# Serialization & Types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
thiserror = "2"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }

# Security & Auth
argon2 = "0.5"
jsonwebtoken = "9"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.22"

# Files, Thumbnails, ZIP, QR, HTML Templates
walkdir = "2"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
async_zip = { version = "0.0.17", features = ["tokio", "tokio-fs"] }
qrcode = { version = "0.14", features = ["svg"] }
askama = "0.12"
urlencoding = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
zip = "2"
