name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-rust:
    name: Backend Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust test suite
        run: cargo test --locked

  client-kmp:
    name: Client KMP (tests, Android Debug, PWA wasmJs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: client

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run KMP & Android unit tests
        run: ./gradlew :core:domain:jvmTest testDebugUnitTest --no-daemon

      - name: Build Android Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon

      - name: Build PWA wasmJs production bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon

      - name: Upload PWA & Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passerelle-client-artifacts
          path: |
            client/composeApp/build/outputs/apk/debug/*.apk
            client/composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  deploy-scripts:
    name: Deploy Scripts & Docker Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test 40-generate-config.sh
        run: |
          chmod +x deploy/40-generate-config.sh deploy/tests/test_generate_config.sh
          ./deploy/tests/test_generate_config.sh
